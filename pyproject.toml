[project]
name = "bangladesh-rice-mills-map"
version = "1.0.0"
description = "Confidentiality-safe maps of rice mills surveyed in the 2018 Bangladesh Millers and Traders Survey (MATS)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.3",
    "ipykernel>=6.29",
    "matplotlib>=3.10.9",
    "nbconvert>=7.16",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyogrio>=0.12.1",
    "shapely>=2.1.2",
]

[tool.uv]
package = false
